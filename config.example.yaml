# Conductor example configuration.
#
# This keyless demo wires two mock providers so the whole request lifecycle —
# routing, fallback, streaming, and trace/cost recording — runs with zero API
# keys. The primary is configured to always fail, so every request visibly fails
# over to the secondary. Swap in real providers (see the commented block) once
# you have credentials.

server:
  address: ":8080"
  # api_key: ${CONDUCTOR_API_KEY}   # uncomment to require Bearer auth
  request_timeout: 120

providers:
  # Primary: forced to fail, to demonstrate automatic failover.
  - name: primary
    use: providers.mock
    settings:
      models: ["gpt-4o-mini"]
      fail: true

  # Fallback: serves the request the primary could not.
  - name: fallback
    use: providers.mock
    settings:
      models: ["gpt-4o-mini"]
      reply: "Hello from the fallback provider!"
      latency_ms: 50
      pricing:
        input_per_1k: 0.0005
        output_per_1k: 0.0015

router:
  use: router.static
  settings:
    order: [primary, fallback]

trace_store:
  use: memory.sqlite
  settings:
    path: conductor.db

# Phase 2: load *.yaml workflow definitions from this directory. Run one with
# POST /v1/workflows/{name}/run. See workflows/summarize.yaml.
workflows:
  dir: ./workflows

# Phase 2: cron-triggered workflow runs. Each job runs a workflow on a standard
# 5-field cron schedule with fixed inputs; runs persist to the trace store's DB
# and appear (tagged "scheduled") in the dashboard's run history and /v1/schedules.
# scheduler:
#   jobs:
#     - name: daily-summary
#       workflow: summarize
#       cron: "0 9 * * *"        # every day at 09:00 (server local time)
#       inputs:
#         topic: "yesterday's support tickets"

