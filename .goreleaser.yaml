# GoReleaser configuration for Conductor.
# Builds the single static (CGO-free) binary for every supported OS/arch and
# publishes archives + checksums to a GitHub Release on each tag push.
# Validate locally with:  goreleaser check   and   goreleaser build --snapshot --clean
version: 2

project_name: conductor

before:
  hooks:
    - go mod tidy

builds:
  - id: conductor
    main: ./cmd/conductor
    binary: conductor
    # Pure-Go, statically linked — the single-binary promise.
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # -s -w strip debug info for smaller binaries; version is injected here.
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # No first-class Windows/arm64 target for the MVP.
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats:
      - tar.gz
    # e.g. conductor_0.1.0_linux_amd64.tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - config.example.yaml

checksum:
  name_template: checksums.txt

snapshot:
  # Version stamp used by `--snapshot` builds (no tag required).
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  draft: false
  # Mark pre-1.0.0 tags with a suffix as prereleases automatically.
  prerelease: auto
